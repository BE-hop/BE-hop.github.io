title_zh: 关于我
title_en: About
subtitle_zh: 设计与 AI 实践者
subtitle_en: Design & AI Practitioner
background_image: /img/about.me.jpg
intro_zh: 以空间设计为起点，构建面向设计、学习与研究的 AI 工具和交互系统。
intro_en: Starting with spatial design, I build AI tools and interfaces for design, learning, and research.
sections:
- title_zh: 当前实践
  title_en: Current practice
  body_zh: 我的实践横跨空间设计与个人软件。设计项目让我理解场地、使用者与约束；RU-LineArt 等工具探索如何衔接图像与建模，Paperflow、语境英语、RUecord-money 和 Life-Button
    则回应研究、学习、记录与工作台组织中的具体问题。
  body_en: My practice connects spatial design with personal software. Design projects ground my work in context,
    people, and constraints. RU-LineArt explores the transition from images to models; Paperflow, Context English,
    RUecord-money, and Life-Button address research, learning, recording, and organizing a workspace.
- title_zh: 工作方法
  title_en: How I work
  body_zh: 从自己遇到的问题出发，明确输入、输出和判断标准，再通过原型与实际使用反馈持续迭代。我关注的不只是生成了什么，也包括它能否被理解、编辑、验证和继续使用。
  body_en: I start with problems I encounter, define inputs, outputs, and quality criteria, then iterate through
    prototypes and feedback from use. I care about whether an output can be understood, edited, checked, and used
    again.
- title_zh: 长期关注
  title_en: Ongoing questions
  body_zh: 我持续关注空间、软件、AI 与交互如何支持学习、创造、研究与思考，也探索虚实空间与机器人带来的新界面。这些是长期研究方向；人的目标、判断和责任始终是设计的起点。
  body_en: I keep asking how space, software, AI, and interaction can support learning, creating, researching, and
    thinking. Physical–digital interfaces and robotics remain areas of exploration, grounded in human goals, judgment,
    and responsibility.
