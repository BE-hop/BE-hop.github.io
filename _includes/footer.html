<!-- async load function -->
<script>
    function async(u, c) {
        var d = document, t = 'script',
            o = d.createElement(t),
            s = d.getElementsByTagName(t)[0];
        o.src = u;
        if (c) { o.addEventListener('load', function (e) { c(null, e); }, false); }
        s.parentNode.insertBefore(o, s);
    }
</script>

{% if page.plchart %}
<!-- jquery.tagcloud.js -->
<script>
    // https://stackoverflow.com/questions/9975810/make-iframe-automatically-adjust-height-according-to-the-contents-without-using
    function resizeIframe(obj) {
        obj.style.height = obj.contentWindow.document.body.scrollHeight + 'px';
    }

    if (window.jQuery) jQuery(document).ready(function () {
        var $chart = document.querySelector("#chart");
        $chart.onload = function () {
            resizeIframe($chart)
        }
        window.addEventListener("resize", () => {
            resizeIframe($chart)
        });
    })
</script>
{% endif %}

<!-- Multi-Lingual -->
{% if page.multilingual %}
<!-- Handle Language Change -->
<script type="text/javascript">
    (function () {
        var $zh = document.querySelector(".zh");
        var $en = document.querySelector(".en");
        var langButtons = document.querySelectorAll("[data-lang]");
        var i18nNodes = document.querySelectorAll("[data-zh][data-en], [data-i18n-zh][data-i18n-en]");
        var blogRoot = document.querySelectorAll("[data-blog-root]");
        var blogLatest = document.querySelectorAll("[data-blog-latest]");
        var blogAbout = document.querySelectorAll("[data-blog-about]");
        var blogArchive = document.querySelectorAll("[data-blog-archive]");
        var siteBase = "{{ site.baseurl }}";

        function storageGet(key, fallback) {
            try {
                var value = localStorage.getItem(key);
                return value === null || value === undefined ? fallback : value;
            } catch (error) {
                return fallback;
            }
        }

        function storageSet(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (error) {
                // ignore storage errors
            }
        }

        function normalizeLang(lang) {
            return lang === "zh" ? "zh" : "en";
        }

        function getInitialLang() {
            var queryLang = new URLSearchParams(document.location.search).get("lang");
            return normalizeLang(queryLang || storageGet("portfolioLang", storageGet("blogLang", storageGet("behopAiLang", "en"))));
        }

        function syncLanguage(lang) {
            storageSet("portfolioLang", lang);
            storageSet("blogLang", lang);
            storageSet("behopAiLang", lang);
        }

        function applyI18nText(lang) {
            i18nNodes.forEach(function (node) {
                var directValue = node.getAttribute(lang === "zh" ? "data-zh" : "data-en");
                var fallbackValue = node.getAttribute(lang === "zh" ? "data-i18n-zh" : "data-i18n-en");
                var value = directValue || fallbackValue;
                if (value) {
                    node.textContent = value;
                }
            });
        }

        function applyLocalizedLinks(lang) {
            blogRoot.forEach(function (node) {
                node.setAttribute("href", lang === "en" ? siteBase + "/blog/en/" : siteBase + "/blog/");
            });
            blogLatest.forEach(function (node) {
                node.setAttribute("href", lang === "en" ? siteBase + "/blog/en/" : siteBase + "/blog/");
            });
            blogAbout.forEach(function (node) {
                node.setAttribute("href", lang === "en" ? siteBase + "/blog/about/en/" : siteBase + "/blog/about/");
            });
            blogArchive.forEach(function (node) {
                node.setAttribute("href", lang === "en" ? siteBase + "/archive/en/" : siteBase + "/archive/");
            });
        }

        function renderLang(lang) {
            lang = normalizeLang(lang);
            document.documentElement.lang = lang;
            syncLanguage(lang);
            applyI18nText(lang);
            applyLocalizedLinks(lang);

            if ($zh && $en) {
                var isZh = lang === "zh";
                $zh.style.display = isZh ? "block" : "none";
                $zh.classList.toggle("active", isZh);
                $en.style.display = isZh ? "none" : "block";
                $en.classList.toggle("active", !isZh);
            }

            langButtons.forEach(function (button) {
                if (button.dataset.lang) {
                    button.classList.toggle("is-active", button.dataset.lang === lang);
                }
            });

            if (typeof generateCatalog === "function") {
                generateCatalog(".catalog-body");
            }
        }

        langButtons.forEach(function (button) {
            if (!button.dataset.lang) return;
            button.addEventListener("click", function () {
                renderLang(button.dataset.lang || "en");
            });
        });

        renderLang(getInitialLang());
    })();
</script>
{% endif %}
