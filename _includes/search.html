<!-- Search is enhanced only when the native reader script is available. -->
<button type="button" class="blog-search-open search-icon" aria-controls="blog-search" hidden data-en="Search" data-zh="搜索">Search</button>
<div class="search-page" id="blog-search" role="dialog" aria-modal="true" aria-label="Search articles / 搜索文章" aria-hidden="true">
  <div class="search-icon-close-container">
    <button type="button" class="search-icon-close" aria-label="Close search / 关闭搜索">↓</button>
  </div>
  <div class="search-main container">
    <div class="row">
      <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
        <form role="search">
          <label class="sr-only" for="search-input">Search articles / 搜索文章</label>
          <input type="search" id="search-input" placeholder="Search articles / 搜索文章">
        </form>
        <div id="search-results" class="mini-post-list" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>
