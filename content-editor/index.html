<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BE-hop Visual Editor</title>
  <link rel="stylesheet" href="/assets/editor.css">
</head>
<body class="visual-editor">
  <header class="visual-topbar">
    <div class="visual-brand">
      <strong>BE-hop</strong>
      <span>可视化编辑</span>
      <span id="preview-health" class="health-pill">检查预览…</span>
    </div>
    <div class="visual-controls">
      <div class="segmented" aria-label="工作模式">
        <button type="button" data-work-mode="edit" class="is-active">编辑</button>
        <button type="button" data-work-mode="preview">预览</button>
      </div>
      <div class="segmented" aria-label="页面语言">
        <button type="button" data-preview-lang="en" class="is-active">EN</button>
        <button type="button" data-preview-lang="zh">中文</button>
      </div>
      <select id="page-picker" aria-label="打开页面"></select>
      <button id="content-button" type="button">内容</button>
      <button id="inspector-button" type="button">设置</button>
      <button id="history-button" type="button" disabled>历史</button>
      <button id="save-all-button" class="primary-button" type="button" disabled>全部已保存</button>
      <button id="publish-button" type="button" disabled>检查并发布</button>
    </div>
  </header>

  <div id="status" class="visual-status" role="status" aria-live="polite"></div>
  <main class="canvas-shell">
    <iframe id="preview-frame" title="BE-hop 网站编辑画布" src="http://127.0.0.1:4001/"></iframe>
  </main>

  <aside id="content-drawer" class="visual-drawer visual-drawer--left" aria-hidden="true">
    <div class="drawer-heading"><div><small>网站内容</small><h2>选择编辑对象</h2></div><button type="button" data-close-drawer>关闭</button></div>
    <nav id="type-tabs" class="compact-tabs"></nav>
    <label class="search-field"><span>搜索</span><input id="record-search" type="search" placeholder="标题、年份或状态"></label>
    <div class="list-toolbar"><span id="record-count">0 项</span><button id="new-button" type="button">新建</button></div>
    <div id="record-list" class="record-list"></div>
  </aside>

  <aside id="inspector-drawer" class="visual-drawer visual-drawer--right" aria-hidden="true">
    <div class="drawer-heading"><div><small id="current-type">设置</small><h2 id="current-title">选择页面元素</h2></div><button type="button" data-close-drawer>关闭</button></div>
    <div id="selection-tools" class="selection-tools" hidden>
      <p id="selection-label"></p>
      <div id="image-tools" hidden>
        <button id="choose-image-button" type="button">选择图片</button>
        <button id="paste-image-button" type="button">粘贴图片</button>
        <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
        <small>也可以复制图片后直接按 Command/Ctrl + V。</small>
      </div>
      <button id="markdown-button" type="button" hidden>编辑 Markdown 正文</button>
    </div>
    <div class="inspector-actions">
      <button id="duplicate-button" type="button" disabled>复制内容</button>
      <button id="delete-button" class="danger-button" type="button" disabled>移入回收站</button>
    </div>
    <nav id="section-nav" class="section-nav"></nav>
    <form id="content-form" class="content-form"></form>
  </aside>

  <dialog id="markdown-dialog">
    <div class="dialog-card markdown-dialog-card">
      <div class="dialog-heading"><h2>编辑 Markdown 正文</h2><button id="markdown-cancel" type="button">取消</button></div>
      <textarea id="markdown-editor" spellcheck="false"></textarea>
      <div class="dialog-actions"><button id="markdown-apply" class="primary-button" type="button">应用到草稿</button></div>
    </div>
  </dialog>

  <dialog id="history-dialog"><div class="dialog-card"><div class="dialog-heading"><h2>历史版本</h2><button type="button" data-close-dialog>关闭</button></div><div id="history-list" class="history-list"></div></div></dialog>
  <dialog id="publish-dialog"><div class="dialog-card"><div class="dialog-heading"><h2>确认发布</h2><button type="button" data-close-dialog>取消</button></div><p>以下文件将被提交并推送：</p><ul id="publish-files" class="publish-files"></ul><label class="field compact-field"><span>提交说明</span><input id="commit-message" value="content(site): update website content" maxlength="120"></label><button id="confirm-publish-button" class="primary-button" type="button">二次确认并推送</button></div></dialog>
  <script src="/assets/editor.js"></script>
</body>
</html>
